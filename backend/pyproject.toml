[project]
name = "fsdiras-backend"
version = "0.1.0"
description = "Financial Scam Detection, Investigation and Recovery Assistance System"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 flags function calls in argument defaults, which is exactly how FastAPI
# dependency injection is written (`db: Session = Depends(get_db)`).
ignore = ["B008"]
