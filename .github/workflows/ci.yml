name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest

    # The suite runs against real Postgres in CI, not SQLite, so anything the
    # local fallback tolerates fails here rather than in a demo.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fsdiras
          POSTGRES_PASSWORD: fsdiras
          POSTGRES_DB: fsdiras_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://fsdiras:fsdiras@localhost:5432/fsdiras_test
        run: pytest --cov=app --cov-report=term-missing
