services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fsdiras
      POSTGRES_PASSWORD: fsdiras
      POSTGRES_DB: fsdiras
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsdiras"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://fsdiras:fsdiras@db:5432/fsdiras
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-in-production}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  pgdata:
